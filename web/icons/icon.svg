<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="everMind">
  <title>everMind</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1D1D21"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
  </defs>

  <!-- Fundo com cantos arredondados -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#27272A" stroke-width="12"/>

  <!--
    Cérebro: dois hemisférios separados por uma fresta central.
    O hemisfério direito é um tom mais escuro para dar profundidade e leitura
    clara mesmo em 48x48 px (ícone de aba / home screen).
  -->
  <g>
    <!-- hemisfério esquerdo -->
    <ellipse cx="190" cy="205" rx="62" ry="86" fill="#FAFAFA"/>
    <!-- hemisfério direito -->
    <ellipse cx="322" cy="205" rx="62" ry="86" fill="#A1A1AA"/>
    <!-- sulcos -->
    <g fill="#09090B">
      <circle cx="176" cy="172" r="10"/>
      <circle cx="210" cy="214" r="10"/>
      <circle cx="176" cy="248" r="10"/>
      <circle cx="336" cy="172" r="10"/>
      <circle cx="302" cy="214" r="10"/>
      <circle cx="336" cy="248" r="10"/>
    </g>
    <!-- fresta central: sugere a separação dos dois hemisférios -->
    <path d="M256 132v146" stroke="#09090B" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!--
    Broto: o "Brain Baby" que cresce a cada desafio concluído.
    É a metáfora central do domínio (Jardim Digital /_virtual Brain_).
  -->
  <g>
    <path d="M256 318v58" stroke="#FAFAFA" stroke-width="16" stroke-linecap="round"/>
    <ellipse cx="203" cy="336" rx="50" ry="29" fill="#FAFAFA" transform="rotate(-18 203 336)"/>
    <ellipse cx="309" cy="336" rx="50" ry="29" fill="#A1A1AA" transform="rotate(18 309 336)"/>
  </g>
</svg>
